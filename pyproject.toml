[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emba-study-dashboard"
version = "0.1.0"
description = "Shared EMBA coursework and calendar dashboard"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "python-multipart>=0.0.12",
  "pypdf>=5.0",
  "certifi>=2024.8.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]
